# PQ-from-genesis interop devnet: Lighthouse, Prysm, and two Silver nodes,
# sixteen validators each. One Silver keeps a rolling aggregate; the other
# packs only the newest slot's merge.
#
# Run from ethereum-package's `pq` branch. `pq_rolling_aggregate` needs a
# launcher that prepends `SILVER_TOML_PREPEND` to silver.toml:
#
#   kurtosis run --enclave silver-pq-interop <ethereum-package> --args-file kurtosis/net-pq-interop.yaml
#
# Silver is listed last: it opens its ports only at genesis, and Kurtosis
# starts consensus nodes in order, so nodes after it would start late.

participants:
  - el_type: ethrex
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:pq-devnet-0
    vc_type: lighthouse
    vc_image: ethpandaops/lighthouse:pq-devnet-0
    supernode: true
    validator_count: 16
  - el_type: ethrex
    cl_type: prysm
    cl_image: ethpandaops/prysm-beacon-chain:pq-devnet-0
    vc_type: prysm
    vc_image: ethpandaops/prysm-validator:pq-devnet-0
    supernode: true
    validator_count: 16
  - el_type: ethrex
    cl_type: silver
    cl_image: silver:pq-devnet-0
    vc_type: lighthouse
    vc_image: ethpandaops/lighthouse:pq-devnet-0
    validator_count: 16
  - el_type: ethrex
    cl_type: silver
    cl_image: silver:pq-devnet-0
    cl_extra_env_vars:
      SILVER_TOML_PREPEND: pq_rolling_aggregate = true
    vc_type: lighthouse
    vc_image: ethpandaops/lighthouse:pq-devnet-0
    validator_count: 16

network_params:
  preset: mainnet
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  pq_fork_epoch: 0
  num_validator_keys_per_node: 16
  attestation_subnet_count_pq: 2
  genesis_delay: 120

additional_services:
  - dora

global_log_level: info
